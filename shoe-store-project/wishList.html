<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="./assets/Css/style.css" />
    <link rel="stylesheet" href="./assets/Css/wishLish.css" />
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main>
        <section class="wishlist-header" style="background-image: url(assets/Photo/WishListBG.png);">
            <div class="container">
                <h1 style="color: white;">Your Wishlist</h1>
                <p>Explore your favorite shoes and add them to your cart anytime. Keep track of the styles you love!</p>
                <a href="index.html" class="btn btn-outline-light">Back to Home</a>
            </div>
        </section>
        <section class="wishlist-items container">  
                 <div class="row" id="wishlist-container">           
                    <div class="sellersProduct col-md-3">
                    <img src="./assets/Photo/shose 3.png" class="card-img-top img2" alt="Renew Elevate 3">
                    <div class="card-body">
                        <div class="icone2">
                            <a href="#" class="remove-from-wishlist" data-title="Renew Elevate 3"><i class="fa-solid fa-trash"></i></a>
                            <a href="#"><i class="fa-regular fa-eye"></i></a>
                            <a href="#"><i class="fa-solid fa-right-left"></i></a>
                        </div>
                        <div class="Description-Shose">
                            <h3 class="card-title">Renew Elevate 3</h3>
                            <div class="star">
                                <i class="fa-regular fa-star"></i>
                                <i class="fa-regular fa-star"></i>
                                <i class="fa-regular fa-star"></i>
                                <i class="fa-regular fa-star"></i>
                                <i class="fa-regular fa-star"></i>
                            </div>
                            <p>Shoes</p>
                            <p class="priceSum"></p>
                            <span>Color: </span>
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Choose the color you prefer</option>
                                <option value="1">Green</option>
                                <option value="2">Black</option>
                                <option value="3">White</option>
                            </select>
                            <button class="Cart">
                                <span>Add to cart</span>
                                <i class="fa-solid fa-bag-shopping"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script>
        fetch('static html/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            });

        fetch('static html/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./assets/JS/wishList.js"></script>
</body>
</html>

  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cart - Footswear</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="./assets/Css/style.css" />
    <link rel="stylesheet" href="./assets/Css/cart.css" />
  </head>
  <body>
    <!-- Placeholder for navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Cart page content -->
    <main class="container my-4 cart-container">
      <div class="cart-header">
        <h1>My Cart</h1>
        <h4>You have <span id="cart-item-count">0</span> items</h4>
      </div>

      <div class="row cart-content">
        <!-- Cart Items -->
        <div class="col-12 col-lg-8 cart-items-section">
          <div class="cart-items">
            <!-- Cart items will be populated dynamically via JavaScript -->
          </div>
        </div>

        <!-- Order Summary -->
        <div class="col-12 col-lg-4 cart-summary-section">
          <div class="card summary-card">
            <div class="card-body">
              <h3 class="card-title mb-3">Order Summary</h3>
              <div class="summary-item d-flex justify-content-between mb-2">
                <span>Subtotal (<span id="summary-item-count">0</span> items)</span>
                <span id="subtotal">USD 0.00</span>
              </div>
              <div class="summary-item d-flex justify-content-between mb-2">
                <span>Shipping</span>
                <span id="shipping">USD 5.00</span>
              </div>
              <hr>
              <div class="summary-item d-flex justify-content-between mb-3">
                <strong>Total</strong>
                <strong id="total">USD 0.00</strong>
              </div>
              <button class="btn btn-primary w-100 checkout-btn">Proceed to Checkout</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Placeholder for footer -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./assets/JS/main.js"></script>
    <script src="./assets/JS/cart.js"></script>
  </body>
  </html>

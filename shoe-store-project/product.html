<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="./assets/Css/style.css" />
  <link rel="stylesheet" href="./assets/Css/product.css" />
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="product-container">
    <img id="product-image" class="product-image" src="" alt="Product Image">
    <div class="product-details">
      <h1 id="product-title"></h1>
      <div class="star">
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
        <i class="fa-regular fa-star"></i>
      </div>
      <p class="description">Shoes</p>
      <p class="price" id="product-price"></p>
      <div class="icons" id="product-icons">
        <a href="#"><i class="fa-regular fa-heart"></i></a>
        <a href="#"><i class="fa-regular fa-eye"></i></a>
        <a href="#"><i class="fa-solid fa-right-left"></i></a>
      </div>
      <span>Color: </span>
      <select class="form-select" aria-label="Default select example">
        <option selected>Choose the color you prefer</option>
        <option value="1">Green</option>
        <option value="2">Black</option>
        <option value="3">White</option>
      </select>
      <button class="cart-button" onclick="addToCart()">
        <span>Add to cart</span>
        <i class="fa-solid fa-bag-shopping"></i>
      </button>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script>
    fetch('static html/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-placeholder').innerHTML = data;
        });

    fetch('static html/footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer-placeholder').innerHTML = data;
        });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./assets/JS/product.js"></script>
</body>
</html>
